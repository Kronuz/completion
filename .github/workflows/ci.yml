name: CI
on:
  push:
    branches: [main, master, 'quest/**']
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      cmake_args: -DCOMPLETION_BUILD_BENCH=ON  # builds the platform probes; their smoke tests time nothing
